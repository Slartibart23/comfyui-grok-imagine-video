[project]
name = "comfyui-grok-imagine-video"
description = "ComfyUI nodes for the xAI Grok Imagine API: image generation (grok-imagine-image-2.0, quality tiers), editing with up to 5 images, video generation with all options (image/reference-to-video, voices, 1080p, 15 s, audio), video edit/extend, native VIDEO/AUDIO outputs, save video + prompt + workflow to any path."
version = "2.1.0"
license = { file = "LICENSE" }
dependencies = ["requests>=2.28", "numpy>=1.24", "Pillow>=9.0", "imageio>=2.31", "imageio-ffmpeg>=0.4.9"]

[project.urls]
Repository = "https://github.com/Slartibart23/comfyui-grok-imagine-video"

[tool.comfy]
DisplayName = "Grok Imagine (xAI)"
PublisherId = ""
